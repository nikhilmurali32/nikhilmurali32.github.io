name: Build and Deploy Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout portfolio source
      uses: actions/checkout@v4
      with:
        repository: nikhilmurali32/developer-portfolio
        ref: master

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '14'

    - name: Install dependencies
      run: npm install --legacy-peer-deps --force

    - name: Build
      run: npm run build:ci
      env:
        CI: false

    - name: Deploy to gh-pages branch
      run: |
        cd build
        git init
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "Deploy portfolio"
        git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/nikhilmurali32/nikhilmurali32.github.io.git HEAD:gh-pages
